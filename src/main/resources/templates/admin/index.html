<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Admin dashbroad</title>
<link
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
	rel="stylesheet">
</head>

<body class="bg-light">
	<div class="container-fluid">
		<div class="row">
			<!-- Sidebar -->
			<div th:replace="~{admin/sidebar :: adminSidebar}"></div>

			<!-- Main Content -->
			<div class="col-md-10 offset-md-2 p-4">
				<!-- Top Bar -->
				<div
					class="bg-primary text-white p-3 rounded mb-4 d-flex justify-content-between align-items-center">
					<h4 class="mb-0">
						<i class="fas fa-file-alt"></i> Quản lý tài liệu
					</h4>
					<div>
						<span id="current-date"></span>
					</div>
				</div>

				<!-- Alerts -->
				<div th:if="${message}"
					class="alert alert-success alert-dismissible fade show"
					role="alert">
					<i class="fas fa-check-circle"></i> <span th:text="${message}"></span>
					<button type="button" class="close" data-dismiss="alert"
						aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>

				<div th:if="${error}"
					class="alert alert-danger alert-dismissible fade show" role="alert">
					<i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
					<button type="button" class="close" data-dismiss="alert"
						aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>

				<!-- Stats Cards -->
				<div class="row mb-4">
					<div class="col-md-3">
						<div class="card border-left-primary h-100 py-2 shadow-sm">
							<div class="card-body">
								<div class="row no-gutters align-items-center">
									<div class="col mr-2">
										<div
											class="text-xs font-weight-bold text-muted text-uppercase mb-1">Tổng
											tài liệu</div>
										<div class="h5 mb-0 font-weight-bold text-gray-800"
											th:text="${documentsCount}">0</div>
									</div>
									<div class="col-auto">
										<i class="fas fa-file-alt fa-2x text-primary"></i>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="col-md-3">
						<div class="card border-left-primary h-100 py-2 shadow-sm">
							<div class="card-body">
								<div class="row no-gutters align-items-center">
									<div class="col mr-2">
										<div
											class="text-xs font-weight-bold text-muted text-uppercase mb-1">Người
											dùng</div>
										<div class="h5 mb-0 font-weight-bold text-gray-800"
											th:text="${userCount}">0</div>
									</div>
									<div class="col-auto">
										<i class="fas fa-users fa-2x text-primary"></i>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="col-md-3">
						<div class="card border-left-primary h-100 py-2 shadow-sm">
							<div class="card-body">
								<div class="row no-gutters align-items-center">
									<div class="col mr-2">
										<div
											class="text-xs font-weight-bold text-muted text-uppercase mb-1">Dung
											lượng</div>
										<div class="h5 mb-0 font-weight-bold text-gray-800"
											th:text="${totalSize}">0 MB</div>
									</div>
									<div class="col-auto">
										<i class="fas fa-database fa-2x text-primary"></i>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="col-md-3">
						<div class="card border-left-primary h-100 py-2 shadow-sm">
							<div class="card-body">
								<div class="row no-gutters align-items-center">
									<div class="col mr-2">
										<div
											class="text-xs font-weight-bold text-muted text-uppercase mb-1">Loại
											file</div>
										<div class="h5 mb-0 font-weight-bold text-gray-800"
											th:text="${fileTypesCount}">0</div>
									</div>
									<div class="col-auto">
										<i class="fas fa-file-code fa-2x text-primary"></i>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Document List -->
				<div class="card mb-4 shadow-sm">
					<div
						class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
						<h5 class="mb-0">
							<i class="fas fa-clock"></i> Tài liệu mới nhất
						</h5>
					</div>
					<div class="card-body">
						<div class="table-responsive">
							<table class="table table-hover">
								<thead>
									<tr>
										<th>ID</th>
										<th>Tên file</th>
										<th>Loại</th>
										<th>Kích thước</th>
										<th>Người dùng</th>
										<th>Thời gian upload</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="doc : ${documents}">
										<td th:text="${doc.id}"></td>
										<td th:text="${doc.filename}"></td>
										<td th:text="${doc.fileType}"></td>
										<td
											th:text="${#numbers.formatDecimal(doc.size/1024, 1, 2) + ' KB'}"></td>
										<td th:text="${doc.user != null ? doc.user.username : 'N/A'}"></td>
										<td
											th:text="${#temporals.format(doc.timeUpload, 'dd/MM/yyyy HH:mm')}"></td>
										<td><a class="btn btn-sm btn-info"
											th:href="@{'/admin/documents/download/' + ${doc.id}}">Tải về</a></td>
									</tr>
									<tr th:if="${documents.empty}">
										<td colspan="7" class="text-center">Không có tài liệu nào</td>
									</tr>
								</tbody>
							</table>
						</div>

						<!-- Nút xem thêm -->
						<div class="text-center mt-3">
							<a class="btn btn-outline-primary" href="/admin/documents"> <i
								class="fas fa-list"></i> Xem thêm tài liệu
							</a>
						</div>
					</div>
				</div>

				<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
				<script
					src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
				<script
					src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
			
</body>

</html>
