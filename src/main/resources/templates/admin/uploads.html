<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
	<meta charset="UTF-8">
	<title>Quản Lý Tài Liệu</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap + FontAwesome -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

	<style>
		/* CSS cho select khi invalid */
		select.is-invalid {
			border-color: #dc3545;
			padding-right: calc(1.5em + 0.75rem);
			background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='%23dc3545' viewBox='0 0 12 12'%3e%3cpath d='M7.002 11a1 1 0 0 1-.998-1H6a1 1 0 0 1-.998 1H4a1 1 0 0 1-.998-1H2a1 1 0 0 1-.998-1V4a1 1 0 0 1 .998-1h1a1 1 0 0 1 .998-1h1a1 1 0 0 1 .998 1h1a1 1 0 0 1 .998 1v6a1 1 0 0 1-.998 1z'/%3e%3c/svg%3e");
			background-repeat: no-repeat;
			background-position: right calc(0.375em + 0.1875rem) center;
			background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
		}
	</style>
</head>

<body class="bg-light">
	<div class="container-fluid">
		<div class="row">
			<!-- Sidebar -->
			<div th:replace="~{admin/sidebar :: adminSidebar}"></div>

			<div class="col-md-10 offset-md-2 p-4">
				<div class="card mb-4 shadow-sm">
					<div class="card-header bg-primary text-white">
						<h5 class="mb-0">
							<i class="fas fa-cloud-upload-alt"></i> Upload tài liệu mới
						</h5>
					</div>
					<div class="card-body">
						<!-- Thông báo thành công hoặc lỗi -->
						<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
						<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

						<form id="uploadForm" action="/admin/documents/uploads" method="post" enctype="multipart/form-data" novalidate>
							<div class="form-row align-items-end">
								<!-- File input -->
								<div class="form-group col-md-4">
									<label for="files">Chọn file</label>
									<div class="custom-file">
										<input type="file" class="custom-file-input" id="files" name="files" multiple
											required>
										<label class="custom-file-label" for="files">Chọn file...</label>
									</div>
								</div>

								<!-- Assign user -->
								<div class="form-group col-md-3">
									<label for="assignUser">Gán cho người dùng <span
											class="text-danger">*</span></label>
									<select class="form-control" id="assignUser" name="assignUser" required>
										<option value="">-- Chọn người dùng --</option>
										<option th:each="user : ${users}" th:value="${user.id}"
											th:text="${user.username}"></option>
									</select>
									<div class="invalid-feedback">Vui lòng chọn người dùng.</div>
								</div>

								<!-- Status -->
								<div class="form-group col-md-3">
									<label for="status">Trạng thái tài liệu <span class="text-danger">*</span></label>
									<select class="form-control" id="status" name="status" required>
										<option value="">-- Chọn trạng thái --</option>
										<option value="0">Riêng tư (Private)</option>
										<option value="2">Công khai (Public)</option>
									</select>
									<div class="invalid-feedback">Vui lòng chọn trạng thái tài liệu.</div>
								</div>

								<!-- Submit button -->
								<div class="form-group col-md-2">
									<button type="submit" class="btn btn-success btn-block">
										<i class="fas fa-upload"></i> Upload
									</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS & Custom Script -->
	<script>
		// Cập nhật label cho file khi chọn file
		document.getElementById("files").addEventListener("change", function () {
			var fileLabel = document.querySelector("label[for='files']");
			var fileNames = Array.from(this.files).map(f => f.name).join(", ");
			fileLabel.textContent = fileNames || "Chọn file...";
		});

		document.getElementById("uploadForm").addEventListener("submit", function (event) {
			var userSelect = document.getElementById("assignUser");
			var fileInput = document.getElementById("files");
			var statusSelect = document.getElementById("status");

			let isValid = true;

			// Kiểm tra chọn người dùng
			if (!userSelect.value) {
				userSelect.classList.add("is-invalid");
				isValid = false;
			} else {
				userSelect.classList.remove("is-invalid");
			}

			// Kiểm tra chọn trạng thái
			if (!statusSelect.value) {
				statusSelect.classList.add("is-invalid");
				isValid = false;
			} else {
				statusSelect.classList.remove("is-invalid");
			}

			// Kiểm tra file
			if (fileInput.files.length === 0) {
				alert("Vui lòng chọn ít nhất một file để upload.");
				isValid = false;
			}

			if (!isValid) {
				event.preventDefault();
			}
		});

		// Reset lại label file khi quay lại trang
		window.addEventListener('pageshow', function () {
			document.querySelector("label[for='files']").textContent = 'Chọn file...';
		});
		
	</script>
</body>

</html>
