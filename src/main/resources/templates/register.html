<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            background: linear-gradient(to right, #8360c3, #2ebf91);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 450px;
            color: #ffffff;
        }

        .register-card h2 {
            font-size: 30px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 500;
            color: #fff;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            transition: 0.3s ease;
        }

        .form-control::placeholder {
            color: #e0e0e0;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px #fff;
            color: #fff;
        }

        .btn-register {
            width: 100%;
            background: linear-gradient(to right, #ff6a00, #ee0979);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin-top: 15px;
            transition: 0.3s ease-in-out;
        }

        .btn-register:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        .register-card a {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #e0e0e0;
        }

        .register-card a:hover {
            text-decoration: underline;
            color: #fff;
        }

        .text-danger,
        .text-success {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        @media (max-width: 576px) {
            .register-card {
                padding: 30px 20px;
            }

            .register-card h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="register-card">
        <h2>Đăng ký tài khoản</h2>
        <form action="/register" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Tài khoản</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Nhập tài khoản">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Nhập mật khẩu">
            </div>
            <div class="mb-3">
                <label for="confirm-password" class="form-label">Xác nhận mật khẩu</label>
                <input type="password" class="form-control" id="confirm-password" name="confirmPassword" required placeholder="Nhập lại mật khẩu">
            </div>
            <button type="submit" class="btn btn-register">Đăng ký</button>
        </form>
        <a href="/login">Đã có tài khoản? Đăng nhập tại đây</a>

        <p th:if="${error != null}" class="text-danger" th:text="${error}"></p>
        <p th:if="${message != null}" class="text-success" th:text="${message}"></p>
    </div>
</body>

</html>
