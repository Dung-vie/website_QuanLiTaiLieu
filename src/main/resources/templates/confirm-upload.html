<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác Nhận Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg">
                    <div class="card-header bg-warning text-dark text-center">
                        <h4><i class="bi bi-exclamation-triangle-fill me-2"></i>File Đã Tồn Tại</h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Thông báo lỗi -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-x-circle-fill me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <div class="text-center mb-4">
                            <i class="bi bi-file-earmark-x text-warning" style="font-size: 3rem;"></i>
                            <h5 class="mt-3">File "<span class="text-danger fw-bold" th:text="${fileName}">tên_file</span>" đã tồn tại!</h5>
                            <p class="text-muted">Vui lòng đổi tên file để tiếp tục upload hoặc hủy bỏ.</p>
                        </div>

                        <!-- Form đổi tên và upload -->
                        <form th:action="@{/documents/confirm-upload}" method="post" class="mb-3">
                            <input type="hidden" name="action" value="upload"/>
                            
                            <div class="mb-3">
                                <label for="newFilename" class="form-label fw-bold">
                                    <i class="bi bi-pencil-square me-1"></i>Nhập tên mới (không bao gồm đuôi file):
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-file-text"></i></span>
                                    <input type="text" 
                                           id="newFilename" 
                                           name="newFilename" 
                                           class="form-control" 
                                           placeholder="Nhập tên file mới..."
                                           th:value="${fileName}"
                                           required/>
                                </div>
                                <div class="form-text">
                                    <i class="bi bi-info-circle me-1"></i>
                                    File sẽ được lưu với đuôi gốc: <strong th:text="${originalFilename != null ? originalFilename.substring(originalFilename.lastIndexOf('.')) : ''}"></strong>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="bi bi-cloud-upload-fill me-2"></i>Đổi Tên và Upload
                                </button>
                            </div>
                        </form>

                        <!-- Form hủy bỏ -->
                        <form th:action="@{/documents/confirm-upload}" method="post">
                            <input type="hidden" name="action" value="cancel"/>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-outline-danger">
                                    <i class="bi bi-x-circle me-2"></i>Hủy Bỏ Upload
                                </button>
                            </div>
                        </form>
                        
                        <div class="mt-3 text-center">
                            <small class="text-muted">
                                <i class="bi bi-arrow-left me-1"></i>
                                <a href="/documents/upload" class="text-decoration-none">Quay lại trang upload</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto focus vào input
        document.getElementById('newFilename').focus();
        
        // Select all text khi focus
        document.getElementById('newFilename').addEventListener('focus', function() {
            this.select();
        });
    </script>
</body>
</html>
